<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Powiadomienia</title>
    <link rel="manifest" href="manifest.json" />
    <script src="notification.js" defer></script>
  </head>
  <body>
    <h1>Notification API</h1>
    <p>Uprawnienie do powiadomień: <strong id="permission">?</strong></p>
    <button id="enable">Włącz powiadomienia</button>
    <button id="local">Powiadomienie ze strony</button>
    <button id="sw">Powiadomienie z service workera</button>
    <h2>Web Push</h2>
    <button id="subscribe">Subskrybuj powiadomienia push</button>
    <button id="unsubscribe">Anuluj subskrypcję</button>
    <p>
      <label for="subscription"
        >Subskrypcja (skopiuj do pliku lab_02/subscription.json): </label
      ><br />
      <textarea id="subscription" rows="10" cols="60" readonly></textarea>
    </p>
    <button id="copy">Kopiuj subskrypcję</button>
  </body>
</html>
